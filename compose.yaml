# Stack Poppy Simulation.
#
# Rien ne démarre par défaut : chaque service est derrière un profil, pour
# qu'un `docker compose up` distrait ne lance pas un entraînement de 10M pas.
#
#   docker compose --profile train  up        entraînement + TensorBoard
#   docker compose --profile eval   run --rm eval python scripts/evaluate.py --model ...
#   docker compose --profile mock   up        faux robot (rosbridge seul)
#   docker compose --profile robot  up        pont + faux robot
#   docker compose --profile vision up        serveur de profondeur
#
# Voir docs/DOCKER.md pour la liste complète des commandes.

x-build-common: &build-common
  context: .
  dockerfile: docker/Dockerfile
  args:
    # CPU par défaut. Pour construire en CUDA :
    #   TORCH_INDEX=https://download.pytorch.org/whl/cu121 docker compose build
    TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    # txt : plages de versions (défaut, compatible GPU).
    # lock : versions exactes de requirements/<cible>.lock.
    #   REQUIREMENTS=lock docker compose build train
    REQUIREMENTS: ${REQUIREMENTS:-txt}

services:

  # --- Entraînement ------------------------------------------------------
  train:
    build:
      <<: *build-common
      target: train
    image: poppy-train:latest
    profiles: ["train"]
    volumes:
      # Le code est monté pour itérer sans reconstruire l'image.
      # Il est aussi copié dedans, pour que l'image reste utilisable seule.
      - ./src:/workspace/src:ro
      - ./scripts:/workspace/scripts:ro
      - ./configs:/workspace/configs:ro
      - ./assets:/workspace/assets:ro
      - ./tests:/workspace/tests:ro
      - ./pyproject.toml:/workspace/pyproject.toml:ro
      # Les sorties, elles, doivent survivre au conteneur.
      - ./logs:/workspace/logs
      - ./figs:/workspace/figs
    # n_envs vaut 64 dans configs/poppy_robust.yaml, « optimisé pour 32 cœurs
    # et une RTX 4090 ». Sur une machine ordinaire, SubprocVecEnv n'arrive pas
    # à lancer 64 processus MuJoCo et l'entraînement meurt sur un
    # BrokenPipeError. Le défaut est donc prudent ; une station de travail
    # relève la valeur : POPPY_N_ENVS=64 docker compose --profile train up
    command:
      - python
      - scripts/train_poppy.py
      - --config
      - configs/poppy_robust.yaml
      - --n-envs
      - ${POPPY_N_ENVS:-8}

  # Évaluation d'un modèle déjà entraîné. Même image que `train` : mêmes
  # dépendances, même MUJOCO_GL=osmesa pour le rendu vidéo hors écran.
  # logs/ est monté en écriture, l'option --video y dépose son fichier.
  eval:
    image: poppy-train:latest
    profiles: ["eval"]
    volumes:
      - ./src:/workspace/src:ro
      - ./scripts:/workspace/scripts:ro
      - ./configs:/workspace/configs:ro
      - ./assets:/workspace/assets:ro
      - ./logs:/workspace/logs
    command: ["python", "scripts/evaluate.py", "--help"]

  # Tests et analyse statique. Seul service à monter le dépôt entier en
  # écriture, et il lui faut les deux :
  #   - entier, parce que visu.py et all_baseline.py sont à la racine ; les
  #     montages ciblés de `train` les laissaient hors de portée de ruff,
  #     donc hors du garde-fou.
  #   - en écriture, parce que `ruff check --fix` doit pouvoir corriger.
  # Les exclusions (.venv, logs, assets) sont dans pyproject.toml.
  dev:
    image: poppy-train:latest
    profiles: ["dev"]
    volumes:
      - .:/workspace
    command: ["ruff", "check", "."]

  # Réutilise l'image construite par `train` : pas de bloc `build:` ici.
  # Sinon la surcouche GPU ferait construire deux fois poppy-train:latest,
  # une fois en CUDA (train) et une fois en CPU (tensorboard), avec un
  # gagnant imprévisible.
  #
  # Pas de `depends_on: train` : cette clause démarrerait le conteneur
  # d'entraînement, pas seulement l'image. Lancer TensorBoard déclenchait donc
  # un entraînement de 10 millions de pas en arrière-plan. L'image doit avoir
  # été construite au préalable (`docker compose build train`) ; sinon le
  # message d'erreur le dit clairement.
  tensorboard:
    image: poppy-train:latest
    profiles: ["train"]
    ports:
      - "6006:6006"
    volumes:
      - ./logs:/workspace/logs:ro
    command: ["tensorboard", "--logdir", "/workspace/logs", "--host", "0.0.0.0", "--port", "6006"]

  # --- Robot réel --------------------------------------------------------
  #
  # La commande par défaut est `run_robot.py --help` : le conteneur affiche
  # l'aide et sort. C'est volontaire — rien ne doit partir vers un robot
  # parce que quelqu'un a tapé `up`. Pour piloter réellement, il faut passer
  # la commande explicitement (`docker compose run --rm bridge ...`).
  bridge:
    build:
      <<: *build-common
      target: bridge
    image: poppy-bridge:latest
    profiles: ["robot"]
    depends_on:
      - rosbridge
    volumes:
      - ./src:/workspace/src:ro
      - ./scripts:/workspace/scripts:ro
      - ./configs:/workspace/configs:ro
      - ./assets:/workspace/assets:ro
      # Artefacts d'entraînement (modèles, normalisations) en lecture seule.
      - ./logs:/workspace/logs:ro
    environment:
      # Cible par défaut : le faux robot de cette stack. ros_publisher.py lit
      # POPPY_ROSBRIDGE_HOST et POPPY_ROSBRIDGE_PORT ; pour viser un autre
      # hôte (par exemple le robot réel), redéfinir ces variables à l'exécution.
      POPPY_ROSBRIDGE_HOST: ${POPPY_ROSBRIDGE_HOST:-rosbridge}
      POPPY_ROSBRIDGE_PORT: ${POPPY_ROSBRIDGE_PORT:-9090}
      # Timeout de connexion au pont (s) et période entre deux commandes (s).
      POPPY_ROSBRIDGE_TIMEOUT_S: ${POPPY_ROSBRIDGE_TIMEOUT_S:-10.0}
      POPPY_CONTROL_PERIOD_S: ${POPPY_CONTROL_PERIOD_S:-5.0}

  # Faux robot : un rosbridge nu, sans physique. Il sert à vérifier que le
  # pont se connecte et publie les bons messages, sans mobiliser le matériel.
  rosbridge:
    build:
      <<: *build-common
      target: rosbridge
    image: poppy-rosbridge:latest
    profiles: ["robot", "mock"]
    ports:
      - "9090:9090"

  # --- Vision ------------------------------------------------------------
  vision:
    build:
      <<: *build-common
      target: vision
    image: poppy-vision:latest
    profiles: ["vision"]
    ports:
      - "8000:8000"
    volumes:
      - ./src:/workspace/src:ro
