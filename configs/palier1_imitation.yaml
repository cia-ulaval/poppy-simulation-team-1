# ============================================================
# Poppy Humanoid — Palier 1, piste 3 : imiter une marche de référence
#
# EXPÉRIMENTAL — 8 novembre 2026. Dérivé de configs/palier1_marche_horloge.yaml
# (pilote n° 6) : premiers vrais pas alternés, tronc droit, mais sans avancer.
#
# La piste 3 suit Disney (robot BDX, RSS 2024) et Open Duck Mini : une marche
# de référence générée par Placo (scripts/generate_reference_walk.py, vérifiée
# par scripts/check_reference_walk.py) est stockée dans
# assets/poppy_humanoid/reference_walk.npz. La récompense paie la politique
# pour la suivre, à la phase de l'horloge de marche. La politique ne voit pas
# la référence : seulement la phase (sin, cos), comme chez Open Duck.
#
# La référence : 0,25 m/s, cycle de deux pas en 0,7 s, pas de 8,75 cm, levée
# de 2 cm, bassin roulant de ±6° à chaque pas, couples sous 70 % des limites.
# Elle n'est valable qu'avec fix_left_knee_axis et gait_period: 0.7 (vérifié
# au chargement).
#
# Différences avec palier1_marche_horloge.yaml : environment.reference_init,
# et la section reward:, valeurs d'origine en commentaire.
#
# Usage :
#   python scripts/train_poppy.py --config configs/palier1_imitation.yaml
#   python scripts/train_poppy.py --config configs/palier1_imitation.yaml --timesteps 3000000
# ============================================================

algorithm: PPO

training:
  total_timesteps: 10_000_000
  seed: 42
  checkpoint_freq: 500_000
  eval_freq: 50_000
  n_eval_episodes: 5
  log_dir: ./logs/palier1_imitation

environment:
  n_envs: 12
  frame_skip: 5
  terminate_when_unhealthy: true
  healthy_z_range: [0.25, 0.70]
  normalize_obs: true
  normalize_reward: true
  clip_obs: 10.0
  gamma: 0.99
  normalize_action_space: true
  fix_left_knee_axis: true
  # Cycle de la marche de référence. Observation de 65 dimensions.
  gait_period: 0.7
  # Trois épisodes sur quatre partent d'une phase tirée au hasard, dans la
  # pose de la référence (« reference state initialization », DeepMimic,
  # Peng et al. 2018) : la politique voit toutes les phases dès le début au
  # lieu de n'apprendre que le premier pas. Le quatrième part debout, phase
  # nulle, comme le vrai robot et comme l'évaluation. Open Duck part toujours
  # debout ; DeepMimic trouve ce départ décisif pour les mouvements difficiles.
  reference_init: 0.75

domain_randomization:
  enabled: true
  friction_range: [0.4, 2.0]
  restitution_range: [0.0, 0.5]
  restitution_in_solref: false
  push_as_force: false

# ── Récompense, par pas de 10 ms ─────────────────────────────
# Valeur de palier1_marche_horloge.yaml en commentaire.
reward:
  # ── Imitation : 5,0 par pas au maximum, le terme dominant ──
  # Noyaux exponentiels (DeepMimic) sur ce que Disney et Open Duck imitent.
  # Angles des dix articulations des jambes : 2,0 sur la référence, 1,2 avec
  # 0,1 rad d'erreur sur chacune.
  imitation_pos_weight: 2.0       # —
  imitation_pos_scale: 5.0
  # Haut du corps tenu près de la pose debout : bras, tête, tronc.
  imitation_upper_weight: 0.5     # —
  # Vitesses des jambes : la forme du mouvement, pas seulement la pose.
  imitation_vel_weight: 0.5       # —
  imitation_vel_scale: 0.05
  # Contacts des pieds au bon moment : remplace phase_contact_weight.
  imitation_contact_weight: 1.0   # —
  # Hauteur (~0,40 m) et roulis du bassin : c'est en roulant de ±6° autour de
  # la hanche d'appui que Poppy, sans roulis de cheville, porte son poids.
  imitation_base_weight: 1.0      # —
  imitation_height_scale: 200.0
  imitation_tilt_scale: 20.0

  # ── Avancer : la référence avance à 0,25 m/s, on paie l'avance réelle ──
  forward_weight: 0.0
  max_forward_vel: 0.8
  vel_tracking_weight: 1.5
  target_vel: 0.25
  vel_tracking_sigma: 0.2
  vel_tracking_tau: 1.0
  healthy: 0.5
  upright_weight: 0.25
  torso_upright_weight: 0.25
  # Le haut du corps roule de ±6° avec le bassin : ~0,03 par pas, sans
  # gêner ; un jeté en avant de 25° coûte toujours ~0,5.
  torso_tilt_weight: 5.0
  yaw_rate_weight: 20.0
  yaw_rate_tau: 2.0
  lateral_weight: 0.5
  joint_limit_weight: 2.0
  joint_limit_soft: 0.95
  feet_slide_weight: 0.25

  # ── Termes remplacés par l'imitation ──
  # La référence fixe déjà hauteur, cadence, alternance et durée de vol.
  # ang_vel_xy facturerait le roulis du bassin que la référence demande.
  base_height_weight: 0.0         # 20.0
  ang_vel_xy_weight: 0.0          # 0.1
  phase_contact_weight: 0.0       # 0.5
  gait_single: 0.0                # 0.3
  gait_double: 0.0
  air_time_weight: 0.0            # 10.0

  # ── Douceur ──
  # ctrl_cost mesure l'écart à la pose debout : suivre la référence (genoux
  # pliés) coûterait ~0,9 par pas à 0,5. Les à-coups restent pénalisés ; la
  # référence n'en coûte que 0,001 par pas. La vitesse articulaire de la
  # référence (Σ q̇² ≈ 18 en moyenne) coûterait 0,09 à 0,005.
  ctrl_weight: 0.0                # 0.5
  action_rate_weight: 0.5         # 0.5
  joint_vel_weight: 0.001         # 0.005

# ── PPO : identique à palier1_marche_horloge.yaml ─────────────
ppo:
  learning_rate: 3.0e-4
  learning_rate_schedule: linear
  n_steps: 512
  batch_size: 256
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  # La référence est symétrique (couples gauche et droit identiques au
  # centième) : le miroir ne la contredit pas.
  symmetry_loss_weight: 1.0
  vf_coef: 0.5
  max_grad_norm: 0.8

network:
  hidden_layers: [256, 256]
  activation: relu
  log_std_init: -2
  ortho_init: false

figs_dir: ./figs/palier1_imitation
