  r_arm_z:      {id: 53, bus: haut,   modele: MX-28, sens: -1, zero: 2048, zero_verifie: true,  confiance: bonne,   source: "coude plié, l'avant-bras pointe vers l'extérieur et le haut : la simulation ne le donne qu'avec sens -1 et zéro 2048"}
