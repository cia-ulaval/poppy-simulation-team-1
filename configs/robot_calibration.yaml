# Calibration simulation -> moteurs du Poppy réel, relevée le 13 novembre 2026.
#
# Les 25 SENS sont établis. Les ZÉROS sont confirmés pour les deux coudes, r_arm_z,
# et les hanches y, genoux et chevilles (robot couché sur le dos en pose zéro : jambes
# tendues à plat, pieds à la verticale). Les autres sont l'hypothèse 2048 (512 pour
# les AX). Procédure et pièges : docs/robot-reel.md.
#
# Torse (abs_y, bust_y) : 2048 est SUPPOSÉ, par décision du 13 nov. 2026, sans test
# dédié. Trois indices disent qu'un torse droit demande abs_y + bust_y environ 16 à 24°
# au-dessus de 2048 en cumulé : couché sans couple 2185/2176 ; en pose zéro couché
# abs_y libre à 2185, bust_y à 2094 ; pose debout de l'ancienne équipe ~2130/~2240.
# Le partage entre les deux moteurs reste inconnu. Si le robot penche en avant au
# premier rejeu, regarder ici en premier. Les limites EEPROM, qui suggéraient 1615 et
# 1592, sont écartées : à plat, le torse serait alors plié de 50°.
#
# Convention : angle_sim est l'angle URDF, c'est-à-dire celui du MJCF avec
# fix_left_knee_axis et fix_arm_frames activés.
#   ticks = zero + sens * angle_rad * K
#   K = 4096 / (2*pi) = 651.9 ticks/rad (MX), 1024 / radians(300) = 195.6 ticks/rad (AX)
#
# sens       : +1 direct, -1 inversé.
# zero       : ticks à angle_sim = 0. Les limites EEPROM des moteurs reproduisent
#              exactement les plages URDF avec zéro 2048 et sens +1 partout : elles ont
#              été écrites sans tenir compte du sens, et ne prouvent donc rien. Pour un
#              moteur inversé, elles sont probablement du mauvais côté.
# zero_verifie : true si une pose observée confirme le zéro.
# confiance  : bonne (vu nettement, ou deux observations concordantes), moyenne (une
#              seule observation, ou vidéo difficile).
# source     : comment le sens a été établi.
#
# Le bus « jambes » porte les identifiants 11-25, le bus « haut » 31-54.

articulations:
  l_hip_x:      {id: 11, bus: jambes, modele: MX-28, sens: -1, zero: 2048, zero_verifie: false, confiance: moyenne, source: "assis genoux pliés : − ticks = pied vers l'intérieur, la simulation va vers l'extérieur ; même résultat jambes tendues"}
  l_hip_z:      {id: 12, bus: jambes, modele: MX-28, sens: +1, zero: 2048, zero_verifie: false, confiance: moyenne, source: "assis jambes tendues : + ticks = jambe vers l'intérieur, comme la simulation"}
  l_hip_y:      {id: 13, bus: jambes, modele: MX-64, sens: -1, zero: 2048, zero_verifie: true,  confiance: moyenne, source: "+ ticks = jambe vers l'avant (poteau derrière), la simulation va vers l'arrière"}
  l_knee_y:     {id: 14, bus: jambes, modele: MX-28, sens: +1, zero: 2048, zero_verifie: true,  confiance: moyenne, source: "jambe pendante contre la butée « tendu » de la simulation"}
  l_ankle_y:    {id: 15, bus: jambes, modele: MX-28, sens: -1, zero: 2048, zero_verifie: true,  confiance: moyenne, source: "+ ticks = pointe qui monte, la simulation la fait descendre"}
  r_hip_x:      {id: 21, bus: jambes, modele: MX-28, sens: -1, zero: 2048, zero_verifie: false, confiance: moyenne, source: "assis genoux pliés : + ticks = pied vers l'intérieur, la simulation va vers l'extérieur"}
  r_hip_z:      {id: 22, bus: jambes, modele: MX-28, sens: +1, zero: 2048, zero_verifie: false, confiance: moyenne, source: "assis jambes tendues : − ticks = jambe vers l'intérieur, comme la simulation"}
  r_hip_y:      {id: 23, bus: jambes, modele: MX-64, sens: +1, zero: 2048, zero_verifie: true,  confiance: moyenne, source: "+ ticks = jambe vers l'avant (poteau derrière), comme la simulation"}
  r_knee_y:     {id: 24, bus: jambes, modele: MX-28, sens: +1, zero: 2048, zero_verifie: true,  confiance: moyenne, source: "jambe pendante contre la butée « tendu » de la simulation"}
  r_ankle_y:    {id: 25, bus: jambes, modele: MX-28, sens: +1, zero: 2048, zero_verifie: true,  confiance: moyenne, source: "+ ticks = pointe qui monte, comme la simulation"}
