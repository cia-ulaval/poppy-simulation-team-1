[project]
name = "poppy-simulation"
version = "0.1.0"
description = "Apprentissage de la marche du robot humanoïde Poppy par renforcement"
requires-python = ">=3.11"

[tool.ruff]
# 100 caractères, comme CONTRIBUTING.md. Python 3.11 : celui des images.
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "venv", "logs", "models", "assets"]

[tool.ruff.lint]
# Jeu de règles volontairement réduit pour un premier passage. Activer tout
# Ruff sur un dépôt qui n'a jamais été vérifié produit des centaines d'erreurs
# que personne ne corrige, et l'outil finit ignoré. On élargira règle par
# règle, une fois celles-ci au vert.
select = [
    "E",   # erreurs de style pycodestyle
    "F",   # pyflakes : imports inutilisés, variables non définies, f-strings vides
    "W",   # avertissements pycodestyle
    "I",   # ordre des imports
    "UP",  # tournures dépassées pour la version de Python ciblée
    "B",   # bugbear : pièges courants (mutable par défaut, boucle et closure…)
]
# La dette différée d'avant le nettoyage — 102 occurrences de modernisation
# d'annotations, plus E741, B027, F841 et B905 — vivait presque entièrement
# dans le banc d'essai multi-algorithmes. Il a été supprimé. Il ne reste que
# E501, et les deux exceptions ciblées plus bas.
ignore = [
    "E501",  # longueur de ligne : laissée au formateur, pas au linter
]

[tool.ruff.lint.per-file-ignores]
# Les scripts insèrent la racine du dépôt dans sys.path avant d'importer src/,
# ce qui impose des imports après du code exécutable.
"scripts/*.py" = ["E402"]

# Modernisation des annotations différée sur ce seul fichier. C'est le cœur de
# la simulation : le laisser identique à l'octet près rend vérifiable, par un
# simple diff contre archive/avant-clean-2026-09-18, que le nettoyage n'a
# touché ni à la physique ni à la récompense. 11 occurrences purement
# mécaniques, à reprendre dans un lot dédié quand il n'y aura plus rien à
# prouver.
"src/environments/poppy_humanoid_env.py" = ["UP006", "UP045", "UP035"]

# Vision en pause. close_warning porte une variable inutilisée et un nom
# ambigu, dans une fonction qui de toute façon ne s'exécute pas : NameError sur
# une globale, TypeError sur frame.size[0]. La corriger demande de savoir ce
# que son auteur voulait ; deviner produirait du code faux qui a l'air juste.
# Les défauts sont listés dans src/sensors/README.md.
"src/sensors/depthmap_analysis.py" = ["F841", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Chemins relatifs à la racine du dépôt : les tests importent src/ et scripts/
# sans installation préalable, comme les scripts eux-mêmes.
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: test dépassant quelques secondes (désélectionner avec -m 'not slow')",
]
